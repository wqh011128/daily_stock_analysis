name: 手动科技股票分析

on:
  workflow_dispatch:
    inputs:
      stocks:
        description: '股票/指数代码，英文逗号分隔，例如 688981,sh000688'
        required: true
        default: 'sh000688'
        type: string
      mode:
        description: '分析模式'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - market-only
          - stocks-only
      force_run:
        description: '强制运行（跳过交易日检查）'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 创建目录
        run: mkdir -p data logs reports
      - name: 运行分析
        env:
          STOCK_LIST: ${{ inputs.stocks }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6.1-sol' }}
          REPORT_TYPE: full
          SEARXNG_PUBLIC_INSTANCES_ENABLED: 'false'
        run: |
          if [ "${{ inputs.mode }}" = "market-only" ]; then
            python main.py --market-review ${{ inputs.force_run && '--force-run' || '' }}
          elif [ "${{ inputs.mode }}" = "stocks-only" ]; then
            python main.py --no-market-review ${{ inputs.force_run && '--force-run' || '' }}
          else
            python main.py ${{ inputs.force_run && '--force-run' || '' }}
          fi
      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-analysis-${{ github.run_number }}
          path: |
            reports/
            logs/
          retention-days: 30
