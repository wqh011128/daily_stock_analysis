name: 科技股票智能分析

on:
  schedule:
    - cron: '0 10 * * 1-5' # 北京时间工作日18:00
  workflow_dispatch:
    inputs:
      stocks:
        description: '股票/指数代码，英文逗号分隔；留空使用默认科技观察池'
        required: false
        default: ''
        type: string
      mode:
        description: '分析模式'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - market-only
          - stocks-only
      force_run:
        description: '强制运行（跳过交易日检查）'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 创建目录
        run: mkdir -p data logs reports
      - name: 运行分析
        env:
          # 手动输入 > 仓库变量 STOCK_LIST > 默认观察池
          STOCK_LIST: ${{ inputs.stocks || vars.STOCK_LIST || '588940,sh000688,sh000001,sz399001,sz399006' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6.1-sol' }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ vars.EMAIL_RECEIVERS || '' }}
          EMAIL_SENDER_NAME: '科技股票智能分析助手'
          REPORT_TYPE: full
          LOG_LEVEL: WARNING
          DEBUG: 'false'
          LITELLM_LOG_LEVEL: WARNING
          TICKPLUS_API_KEY: ${{ secrets.TICKPLUS_API_KEY }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          TICKFLOW_API_KEY: ${{ secrets.TICKFLOW_API_KEY }}
          BOCHA_API_KEYS: ${{ secrets.BOCHA_API_KEYS }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          SEARXNG_PUBLIC_INSTANCES_ENABLED: 'false'
        run: |
          FORCE=''
          if [ "${{ inputs.force_run || 'true' }}" = "true" ]; then FORCE='--force-run'; fi
          MODE="${{ inputs.mode || 'full' }}"
          if [ "$MODE" = "market-only" ]; then
            python main.py --market-review $FORCE
          elif [ "$MODE" = "stocks-only" ]; then
            python main.py --no-market-review $FORCE
          else
            python main.py $FORCE
          fi
